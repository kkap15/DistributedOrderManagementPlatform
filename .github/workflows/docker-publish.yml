name: Docker Publish

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/distributedordermanagementplatform

jobs:
  publish:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: apigateway
            context: ./Backend/ApiGateway
            dockerfile: ./Backend/ApiGateway/Dockerfile
          - service: orderservice
            context: ./Backend
            dockerfile: ./Backend/OrderService/Dockerfile
          - service: paymentservice
            context: ./Backend
            dockerfile: ./Backend/PaymentService/Dockerfile
          - service: notificationservice
            context: ./Backend
            dockerfile: ./Backend/NotificationService/Dockerfile
          - service: userservice
            context: ./Backend/UserService
            dockerfile: ./Backend/UserService/Dockerfile
          - service: frontend
            context: ./Frontend/angular-app
            dockerfile: ./Frontend/angular-app/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
