name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    name: Build .NET services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Backend/MicroservicesPlatform.sln

      - name: Build
        run: dotnet build Backend/MicroservicesPlatform.sln --no-restore -c Release

      - name: Test
        run: dotnet test Backend/MicroservicesPlatform.sln --no-build -c Release

  build-frontend:
    name: Build Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/angular-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend/angular-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Test
        run: npx ng test --no-progress --watch=false
